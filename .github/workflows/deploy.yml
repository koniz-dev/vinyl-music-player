name: Deploy to GitHub Pages

# Only redeploy when something that actually ships to the user changes.
# Edits to docs/, README.md, LICENSE, package.json, etc. are skipped.
# Trigger a manual run from the Actions tab if you ever need to force one.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'service-worker.js'
      - 'js/**'
      - 'styles/**'
      - 'favicon/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Don't let overlapping deploys clobber each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
