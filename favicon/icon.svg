<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Dark background -->
  <rect width="512" height="512" rx="96" fill="#09090b"/>

  <!-- Subtle accent glow -->
  <circle cx="256" cy="180" r="200" fill="url(#glow)"/>

  <!-- Vinyl outer -->
  <circle cx="256" cy="256" r="192" fill="url(#vinylBody)"/>

  <!-- Grooves -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="132" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Center disc (accent) -->
  <circle cx="256" cy="256" r="86" fill="url(#center)"/>

  <!-- Inner spindle hole -->
  <circle cx="256" cy="256" r="8" fill="#09090b"/>

  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vinylBody" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1a1a1d"/>
      <stop offset="0.55" stop-color="#0c0c0e"/>
      <stop offset="1" stop-color="#050506"/>
    </radialGradient>
    <linearGradient id="center" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
  </defs>
</svg>
